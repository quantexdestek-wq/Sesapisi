<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hacklendin!</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0a0a;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Courier New', monospace;
        }

        .glitch {
            font-size: 100px;
            font-weight: bold;
            color: #ff0000;
            text-shadow: 4px 4px 0 #000, -4px -4px 0 #000;
            animation: shake 0.1s infinite, flicker 0.2s infinite;
            letter-spacing: 10px;
        }

        @keyframes shake {
            0% { transform: translate(2px, -2px); }
            25% { transform: translate(-3px, 3px); }
            50% { transform: translate(2px, 2px); }
            75% { transform: translate(-2px, -3px); }
            100% { transform: translate(3px, -2px); }
        }

        @keyframes flicker {
            0% { opacity: 1; }
            50% { opacity: 0.8; }
            55% { opacity: 0.3; }
            60% { opacity: 1; }
            100% { opacity: 0.9; }
        }

        .bg-text {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 400px;
            color: rgba(255, 0, 0, 0.03);
            pointer-events: none;
            z-index: -1;
            user-select: none;
        }
    </style>
</head>
<body>
    <div class="bg-text">☠</div>
    <h1 class="glitch">HACKLENDIN</h1>

    <script>
        // URL'den ?ses= parametresini al
        const params = new URLSearchParams(window.location.search);
        const metin = params.get('ses');

        // Eğer ses parametresi varsa çal
        if (metin) {
            const audio = new Audio(
                'https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=tr&q=' +
                encodeURIComponent(metin)
            );
            audio.play();
        }
    </script>
</body>
</html>
