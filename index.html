<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuanPast - Profesyonel Metin Paylaşım Platformu</title>
    <style>
        :root {
            --bg: #0a0a0f;
            --surface: #13131a;
            --card: #1a1a24;
            --border: #252535;
            --accent: #6c5ce7;
            --accent-glow: rgba(108, 92, 231, 0.3);
            --success: #00d2a0;
            --warning: #ffa502;
            --danger: #ff4757;
            --text: #e8e8f0;
            --text-secondary: #9898b0;
            --code-bg: #0d0d14;
            --radius: 16px;
            --radius-sm: 10px;
            --shadow: 0 8px 32px rgba(0,0,0,0.4);
            --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            line-height: 1.6;
            background-image:
                radial-gradient(ellipse at 20% 0%, rgba(108, 92, 231, 0.08) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 100%, rgba(0, 210, 160, 0.05) 0%, transparent 50%);
        }

        /* NAVBAR */
        .navbar {
            background: rgba(19, 19, 26, 0.8);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
            padding: 0 20px;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .nav-inner {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 65px;
            gap: 15px;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            color: white;
        }

        .logo-icon {
            width: 42px;
            height: 42px;
            background: linear-gradient(135deg, #6c5ce7, #a78bfa);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
            box-shadow: 0 4px 20px var(--accent-glow);
        }

        .logo-text {
            font-size: 1.4rem;
            font-weight: 800;
            letter-spacing: -0.5px;
        }
        .logo-text span { color: #a78bfa; }

        .nav-actions {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
        }

        .btn {
            padding: 10px 18px;
            border-radius: 10px;
            border: none;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            transition: all var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 6px;
            text-decoration: none;
            white-space: nowrap;
            font-family: inherit;
        }

        .btn-primary {
            background: var(--accent);
            color: white;
            box-shadow: 0 4px 15px var(--accent-glow);
        }
        .btn-primary:hover {
            background: #7c6cf8;
            transform: translateY(-2px);
            box-shadow: 0 8px 25px var(--accent-glow);
        }

        .btn-outline {
            background: transparent;
            border: 1.5px solid var(--border);
            color: var(--text);
        }
        .btn-outline:hover {
            border-color: var(--accent);
            background: rgba(108, 92, 231, 0.08);
        }

        .btn-ghost {
            background: transparent;
            color: var(--text-secondary);
            padding: 8px 12px;
        }
        .btn-ghost:hover {
            color: white;
            background: rgba(255,255,255,0.05);
            border-radius: 8px;
        }

        .btn-sm { padding: 7px 14px; font-size: 0.8rem; }
        .btn-success { background: var(--success); color: #000; }
        .btn-success:hover { opacity: 0.9; transform: translateY(-2px); }

        /* ANA İÇERİK */
        .main-container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 30px 20px;
        }

        /* HERO */
        .hero {
            text-align: center;
            padding: 40px 20px 30px;
        }
        .hero h1 {
            font-size: 2.5rem;
            font-weight: 800;
            letter-spacing: -1px;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #fff, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .hero p {
            color: var(--text-secondary);
            font-size: 1.1rem;
            max-width: 600px;
            margin: 0 auto;
        }

        /* EDİTÖR KARTI */
        .editor-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            overflow: hidden;
            box-shadow: var(--shadow);
            margin-bottom: 30px;
        }

        .editor-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 20px;
            background: rgba(0,0,0,0.3);
            border-bottom: 1px solid var(--border);
            flex-wrap: wrap;
            gap: 10px;
        }

        .editor-tabs {
            display: flex;
            gap: 4px;
        }
        .editor-tab {
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
            transition: all var(--transition);
            color: var(--text-secondary);
            background: transparent;
            border: none;
            font-family: inherit;
        }
        .editor-tab.active {
            background: var(--accent);
            color: white;
            box-shadow: 0 2px 10px var(--accent-glow);
        }
        .editor-tab:hover:not(.active) {
            color: white;
            background: rgba(255,255,255,0.03);
        }

        .editor-actions {
            display: flex;
            gap: 6px;
            align-items: center;
        }

        .char-badge {
            font-size: 0.8rem;
            color: var(--text-secondary);
            background: var(--surface);
            padding: 6px 12px;
            border-radius: 20px;
            font-weight: 600;
        }

        textarea {
            width: 100%;
            min-height: 350px;
            background: var(--code-bg);
            border: none;
            padding: 25px;
            color: #e0e0f0;
            font-family: 'JetBrains Mono', 'Fira Code', 'Consolas', monospace;
            font-size: 0.95rem;
            line-height: 1.8;
            resize: vertical;
            outline: none;
            transition: all var(--transition);
        }
        textarea::placeholder { color: #3a3a50; font-style: italic; }

        /* AYARLAR PANELİ */
        .settings-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            padding: 20px 25px;
            background: rgba(0,0,0,0.15);
            border-top: 1px solid var(--border);
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .form-group label {
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .form-group input,
        .form-group select {
            padding: 10px 14px;
            background: var(--surface);
            border: 1.5px solid var(--border);
            border-radius: 8px;
            color: white;
            font-size: 0.9rem;
            font-family: inherit;
            transition: all var(--transition);
        }
        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(108, 92, 231, 0.1);
        }
        .form-group select option {
            background: var(--surface);
            color: white;
        }

        .editor-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 25px;
            background: rgba(0,0,0,0.2);
            border-top: 1px solid var(--border);
            flex-wrap: wrap;
            gap: 12px;
        }

        /* SONUÇ KUTUSU */
        .result-card {
            background: var(--card);
            border: 2px solid var(--success);
            border-radius: var(--radius);
            padding: 25px;
            box-shadow: var(--shadow), 0 0 30px rgba(0, 210, 160, 0.1);
            display: none;
            animation: slideUp 0.5s ease;
            margin-bottom: 30px;
        }
        .result-card.show { display: block; }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .result-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 15px;
            color: var(--success);
            font-weight: 700;
            font-size: 1.1rem;
        }

        .url-display {
            display: flex;
            gap: 10px;
            background: var(--surface);
            padding: 15px;
            border-radius: var(--radius-sm);
            align-items: center;
            flex-wrap: wrap;
        }
        .url-display code {
            flex: 1;
            color: var(--success);
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.95rem;
            word-break: break-all;
            min-width: 200px;
        }
        .url-display .btn { flex-shrink: 0; }

        .share-buttons {
            display: flex;
            gap: 10px;
            margin-top: 15px;
            flex-wrap: wrap;
        }

        .preview-mini {
            background: var(--code-bg);
            border-radius: var(--radius-sm);
            padding: 15px;
            margin-top: 15px;
            max-height: 150px;
            overflow-y: auto;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.85rem;
            color: #b0b0c0;
            white-space: pre-wrap;
            border: 1px solid var(--border);
        }

        /* PASTE LİSTESİ */
        .paste-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }
        .paste-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 20px;
            cursor: pointer;
            transition: all var(--transition);
            position: relative;
            overflow: hidden;
        }
        .paste-card:hover {
            border-color: var(--accent);
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .paste-card .card-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 10px;
        }
        .paste-card .card-id {
            font-family: 'JetBrains Mono', monospace;
            color: var(--accent);
            font-weight: 700;
            font-size: 0.85rem;
        }
        .paste-card .card-date {
            font-size: 0.75rem;
            color: var(--text-secondary);
        }
        .paste-card .card-preview {
            color: #b0b0c0;
            font-size: 0.85rem;
            line-height: 1.5;
            max-height: 60px;
            overflow: hidden;
            font-family: 'JetBrains Mono', monospace;
        }
        .paste-card .card-meta {
            display: flex;
            gap: 12px;
            margin-top: 10px;
            font-size: 0.7rem;
            color: var(--text-secondary);
            flex-wrap: wrap;
        }
        .badge {
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 700;
        }
        .badge-locked { background: rgba(255, 165, 2, 0.2); color: var(--warning); }
        .badge-burn { background: rgba(255, 71, 87, 0.2); color: var(--danger); }
        .badge-folder { background: rgba(108, 92, 231, 0.2); color: #a78bfa; }

        /* MODAL */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(5px);
            z-index: 200;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .modal-overlay.active { display: flex; }
        .modal {
            background: var(--card);
            border-radius: var(--radius);
            padding: 35px;
            max-width: 650px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.8);
            border: 1px solid var(--border);
            animation: modalPop 0.3s ease;
            max-height: 85vh;
            overflow-y: auto;
        }
        @keyframes modalPop {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }
        .modal h2 { margin-bottom: 15px; }
        .modal .paste-full {
            background: var(--code-bg);
            padding: 20px;
            border-radius: var(--radius-sm);
            white-space: pre-wrap;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.9rem;
            max-height: 300px;
            overflow-y: auto;
            border: 1px solid var(--border);
        }

        /* TOAST */
        .toast-container {
            position: fixed;
            bottom: 25px;
            right: 25px;
            z-index: 300;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .toast {
            background: #1a1a28;
            color: white;
            padding: 14px 22px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 0.9rem;
            box-shadow: 0 15px 40px rgba(0,0,0,0.6);
            border: 1px solid var(--border);
            animation: toastIn 0.4s ease;
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 250px;
        }
        .toast.success { border-left: 4px solid var(--success); }
        .toast.error { border-left: 4px solid var(--danger); }
        .toast.warning { border-left: 4px solid var(--warning); }
        @keyframes toastIn {
            from { transform: translateX(120%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        /* GÖRÜNTÜLEME SAYFASI */
        .view-page {
            max-width: 800px;
            margin: 30px auto;
            padding: 20px;
            display: none;
        }
        .view-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 35px;
            box-shadow: var(--shadow);
        }
        .view-card .view-id {
            display: inline-block;
            background: var(--accent);
            color: white;
            padding: 6px 16px;
            border-radius: 20px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.9rem;
            font-weight: 700;
            margin-bottom: 20px;
        }
        .view-card .view-content {
            background: var(--code-bg);
            padding: 25px;
            border-radius: var(--radius-sm);
            white-space: pre-wrap;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.95rem;
            line-height: 1.8;
            border: 1px solid var(--border);
            max-height: 500px;
            overflow-y: auto;
        }
        .view-card .view-meta {
            margin-top: 20px;
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            color: var(--text-secondary);
            font-size: 0.85rem;
        }

        /* RESPONSIVE */
        @media (max-width: 768px) {
            .hero h1 { font-size: 1.8rem; }
            textarea { min-height: 250px; font-size: 0.85rem; }
            .settings-row { grid-template-columns: 1fr; }
            .paste-grid { grid-template-columns: 1fr; }
            .nav-actions .btn span { display: none; }
            .btn { padding: 8px 12px; }
        }
    </style>
</head>
<body>

    <!-- NAVBAR -->
    <nav class="navbar">
        <div class="nav-inner">
            <a href="/" class="logo-area" onclick="goHome(event)">
                <div class="logo-icon">📋</div>
                <div class="logo-text">Quan<span>Past</span></div>
            </a>
            <div class="nav-actions">
                <button class="btn btn-ghost btn-sm" onclick="showMyPastes()">📂 <span>Pastelerim</span></button>
                <button class="btn btn-ghost btn-sm" onclick="clearAll()">🗑️ <span>Temizle</span></button>
                <button class="btn btn-primary" onclick="createPaste()">🚀 <span>Oluştur</span></button>
            </div>
        </div>
    </nav>

    <!-- ANA SAYFA -->
    <div class="main-container" id="mainPage">
        <div class="hero">
            <h1>Metnini Paylaş, Linkini Al</h1>
            <p>Hızlı, şık ve güvenli. Tıpkı QuanPast.cc gibi, ama daha modern.</p>
        </div>

        <!-- EDİTÖR -->
        <div class="editor-card">
            <div class="editor-header">
                <div class="editor-tabs">
                    <button class="editor-tab active" onclick="switchMode('text')">📝 Düz Metin</button>
                    <button class="editor-tab" onclick="switchMode('code')">💻 Kod</button>
                </div>
                <div class="editor-actions">
                    <span class="char-badge" id="charCount">0 karakter</span>
                </div>
            </div>

            <textarea id="pasteContent" placeholder="Metnini buraya yaz veya yapıştır...&#10;&#10;Ne yazarsan yaz, sana özel bir link oluşturacağız.&#10;Linki paylaş, herkes yazdığını görsün!"></textarea>

            <div class="settings-row">
                <div class="form-group">
                    <label>📌 Başlık</label>
                    <input type="text" id="pasteTitle" placeholder="Başlık (opsiyonel)" maxlength="100">
                </div>
                <div class="form-group">
                    <label>📁 Klasör</label>
                    <select id="pasteFolder">
                        <option value="">Genel</option>
                        <option value="Kisisel">👤 Kişisel</option>
                        <option value="Is">💼 İş</option>
                        <option value="Kod">💻 Kod</option>
                        <option value="Notlar">📝 Notlar</option>
                        <option value="Sosyal">🌐 Sosyal</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>⏱️ Son Kullanma</label>
                    <select id="pasteExpiry">
                        <option value="never">♾️ Asla</option>
                        <option value="10m">🕐 10 Dakika</option>
                        <option value="1h">🕑 1 Saat</option>
                        <option value="1d">📅 1 Gün</option>
                        <option value="7d">📅 1 Hafta</option>
                        <option value="30d">📅 30 Gün</option>
                        <option value="burn">🔥 Okununca Sil</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>🔒 Şifre</label>
                    <input type="text" id="pastePassword" placeholder="Şifre (opsiyonel)" maxlength="30">
                </div>
            </div>

            <div class="editor-footer">
                <span style="color: var(--text-secondary); font-size: 0.8rem;">
                    💡 <strong>İpucu:</strong> Ctrl+Enter ile hızlıca oluştur
                </span>
                <div style="display:flex;gap:10px;">
                    <button class="btn btn-outline btn-sm" onclick="copyToClipboard()">📋 Kopyala</button>
                    <button class="btn btn-primary" onclick="createPaste()">🚀 Paste Oluştur</button>
                </div>
            </div>
        </div>

        <!-- SONUÇ -->
        <div class="result-card" id="resultCard">
            <div class="result-header">✅ Başarıyla Oluşturuldu!</div>
            <div class="url-display">
                <code id="resultUrl"></code>
                <button class="btn btn-success btn-sm" onclick="copyResultUrl()">📋 Kopyala</button>
            </div>
            <div class="share-buttons">
                <button class="btn btn-outline btn-sm" onclick="shareOnWhatsApp()">💬 WhatsApp</button>
                <button class="btn btn-outline btn-sm" onclick="shareOnTwitter()">🐦 Twitter</button>
                <button class="btn btn-outline btn-sm" onclick="shareViaEmail()">📧 E-posta</button>
            </div>
            <div class="preview-mini" id="resultPreview"></div>
        </div>

        <!-- PASTE LİSTESİ -->
        <div id="pasteListSection" style="display:none;">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:15px;flex-wrap:wrap;gap:10px;">
                <h2 style="font-size:1.3rem;">📂 Pastelerim</h2>
                <div style="display:flex;gap:8px;">
                    <select id="folderFilter" onchange="loadMyPastes()" style="padding:8px 12px;background:var(--surface);border:1px solid var(--border);border-radius:8px;color:white;font-family:inherit;cursor:pointer;">
                        <option value="">Tüm Klasörler</option>
                        <option value="Genel">Genel</option>
                        <option value="Kisisel">Kişisel</option>
                        <option value="Is">İş</option>
                        <option value="Kod">Kod</option>
                        <option value="Notlar">Notlar</option>
                        <option value="Sosyal">Sosyal</option>
                    </select>
                    <button class="btn btn-ghost btn-sm" onclick="hidePasteList()">✕ Kapat</button>
                </div>
            </div>
            <div class="paste-grid" id="pasteGrid"></div>
        </div>
    </div>

    <!-- GÖRÜNTÜLEME SAYFASI -->
    <div class="view-page" id="viewPage">
        <div class="view-card">
            <span class="view-id" id="viewPasteId"></span>
            <div class="view-content" id="viewPasteContent"></div>
            <div class="view-meta">
                <span id="viewPasteDate"></span>
                <span id="viewPasteFolder"></span>
                <span id="viewPasteExpiry"></span>
            </div>
            <div style="margin-top:20px;display:flex;gap:10px;flex-wrap:wrap;">
                <button class="btn btn-primary btn-sm" onclick="copyViewedPaste()">📋 İçeriği Kopyala</button>
                <button class="btn btn-outline btn-sm" onclick="shareCurrentPaste()">🔗 Linki Paylaş</button>
                <a href="/" class="btn btn-ghost btn-sm" onclick="goHome(event)">✏️ Yeni Oluştur</a>
            </div>
        </div>
    </div>

    <!-- MODAL -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal" id="modalContent"></div>
    </div>

    <!-- TOAST -->
    <div class="toast-container" id="toastContainer"></div>

    <script>
        // ==================== VERİTABANI ====================
        const DB_KEY = 'quanpast_db_v2';

        function getDB() {
            try { return JSON.parse(localStorage.getItem(DB_KEY) || '{}'); }
            catch { return {}; }
        }

        function saveDB(db) {
            localStorage.setItem(DB_KEY, JSON.stringify(db));
        }

        function generateId() {
            const chars = 'abcdefghijklmnopqrstuvwxyz0123456789';
            let id = '';
            for (let i = 0; i < 6; i++) id += chars[Math.floor(Math.random() * chars.length)];
            return id;
        }

        function getExpiryTimestamp(option) {
            const now = Date.now();
            const map = {
                '10m': 10 * 60 * 1000,
                '1h': 60 * 60 * 1000,
                '1d': 24 * 60 * 60 * 1000,
                '7d': 7 * 24 * 60 * 60 * 1000,
                '30d': 30 * 24 * 60 * 60 * 1000,
                'burn': 'burn',
                'never': null
            };
            return map[option] === 'burn' ? 'burn' : (map[option] ? now + map[option] : null);
        }

        // ==================== EDİTÖR İŞLEVLERİ ====================
        let currentMode = 'text';
        const textarea = document.getElementById('pasteContent');

        textarea.addEventListener('input', updateCharCount);
        function updateCharCount() {
            const len = textarea.value.length;
            document.getElementById('charCount').textContent =
                len + ' karakter | ' + (textarea.value.trim() ? textarea.value.trim().split(/\s+/).length : 0) + ' kelime';
        }

        function switchMode(mode) {
            currentMode = mode;
            document.querySelectorAll('.editor-tab').forEach(t => t.classList.remove('active'));
            event.target.classList.add('active');
            if (mode === 'code') {
                textarea.style.fontFamily = "'JetBrains Mono', 'Fira Code', monospace";
                textarea.style.fontSize = '0.9rem';
            } else {
                textarea.style.fontFamily = "'Inter', 'Segoe UI', sans-serif";
                textarea.style.fontSize = '1rem';
            }
        }

        function clearAll() {
            if (confirm('Editörü temizlemek istediğinize emin misiniz?')) {
                textarea.value = '';
                document.getElementById('pasteTitle').value = '';
                document.getElementById('pastePassword').value = '';
                document.getElementById('pasteFolder').value = '';
                document.getElementById('pasteExpiry').value = 'never';
                document.getElementById('resultCard').classList.remove('show');
                updateCharCount();
                showToast('🧹 Temizlendi!', 'success');
            }
        }

        function copyToClipboard() {
            const text = textarea.value;
            if (!text) { showToast('⚠️ Kopyalanacak metin yok!', 'warning'); return; }
            navigator.clipboard.writeText(text).then(() => showToast('📋 Metin kopyalandı!', 'success'))
                .catch(() => showToast('❌ Kopyalanamadı', 'error'));
        }

        // ==================== PASTE OLUŞTUR ====================
        function createPaste() {
            const content = textarea.value.trim();
            if (!content) {
                showToast('⚠️ Lütfen bir metin yazın!', 'warning');
                textarea.focus();
                return;
            }

            const pasteId = generateId();
            const title = document.getElementById('pasteTitle').value.trim() || 'İsimsiz Paste';
            const folder = document.getElementById('pasteFolder').value || 'Genel';
            const expiryOption = document.getElementById('pasteExpiry').value;
            const password = document.getElementById('pastePassword').value.trim();
            const expiry = getExpiryTimestamp(expiryOption);

            const paste = {
                id: pasteId,
                title,
                content,
                folder,
                expiry,
                password: password || null,
                burned: false,
                createdAt: Date.now(),
                views: 0
            };

            const db = getDB();
            db[pasteId] = paste;
            saveDB(db);

            // Sonuç göster
            const url = window.location.origin + window.location.pathname + '?p=' + pasteId;
            document.getElementById('resultUrl').textContent = url;
            document.getElementById('resultPreview').textContent = content.substring(0, 300) +
                (content.length > 300 ? '\n\n... (devamı linkte)' : '');
            document.getElementById('resultCard').classList.add('show');
            document.getElementById('resultCard').scrollIntoView({ behavior: 'smooth' });

            showToast('🎉 Paste oluşturuldu! Linki paylaşabilirsin.', 'success');
        }

        function copyResultUrl() {
            const url = document.getElementById('resultUrl').textContent;
            navigator.clipboard.writeText(url).then(() => showToast('📋 Link kopyalandı!', 'success'));
        }

        function shareOnWhatsApp() {
            const url = document.getElementById('resultUrl').textContent;
            window.open('https://wa.me/6283896985976?text=siteiçinyazmistim' + '_blank');
        }

        function shareOnTwitter() {
            const url = document.getElementById('resultUrl').textContent;
            window.open('https://twitter.com/intent/tweet?text=' + encodeURIComponent('QuanPast ile paylaşıyorum: ' + url), '_blank');
        }

        function shareViaEmail() {
            const url = document.getElementById('resultUrl').textContent;
            window.location.href = 'mailto:?subject=QuanPast Paylaşımı&body=Merhaba,%0A%0ABu linke göz at: ' + url;
        }

        // ==================== PASTE LİSTESİ ====================
        function showMyPastes() {
            loadMyPastes();
            document.getElementById('pasteListSection').style.display = 'block';
            document.getElementById('pasteListSection').scrollIntoView({ behavior: 'smooth' });
        }

        function hidePasteList() {
            document.getElementById('pasteListSection').style.display = 'none';
        }

        function loadMyPastes() {
            const db = getDB();
            const filterFolder = document.getElementById('folderFilter')?.value || '';
            const grid = document.getElementById('pasteGrid');

            let pastes = Object.values(db).filter(p => {
                // Süre kontrolü
                if (p.expiry && p.expiry !== 'burn' && p.expiry < Date.now()) {
                    delete db[p.id];
                    return false;
                }
                if (p.expiry === 'burn' && p.burned) {
                    delete db[p.id];
                    return false;
                }
                if (filterFolder && p.folder !== filterFolder) return false;
                return true;
            }).sort((a, b) => b.createdAt - a.createdAt);

            saveDB(db);

            if (pastes.length === 0) {
                grid.innerHTML = '<p style="grid-column:1/-1;text-align:center;color:#888;padding:40px;">📭 Henüz paste yok. Hemen bir tane oluşturun!</p>';
                return;
            }

            grid.innerHTML = pastes.map(p => `
                <div class="paste-card" onclick="openPaste('${p.id}')">
                    <div class="card-header">
                        <span class="card-id">/${p.id}</span>
                        <span class="card-date">${new Date(p.createdAt).toLocaleDateString('tr-TR', {day:'numeric',month:'short',year:'numeric'})}</span>
                    </div>
                    <div class="card-preview">${escapeHtml(p.title)}</div>
                    <div class="card-preview" style="margin-top:5px;">${escapeHtml(p.content.substring(0, 80))}...</div>
                    <div class="card-meta">
                        ${p.folder ? `<span class="badge badge-folder">📁 ${p.folder}</span>` : ''}
                        ${p.password ? '<span class="badge badge-locked">🔒 Korumalı</span>' : ''}
                        ${p.expiry === 'burn' ? '<span class="badge badge-burn">🔥 Tek Seferlik</span>' : ''}
                        <span>👁️ ${p.views} görüntüleme</span>
                    </div>
                </div>
            `).join('');
        }

        function openPaste(id) {
            window.location.href = '?p=' + id;
        }

        // ==================== PASTE GÖRÜNTÜLEME ====================
        function viewPaste(id) {
            const db = getDB();
            const paste = db[id];

            if (!paste) {
                showViewError('❌ Paste bulunamadı. Link yanlış veya silinmiş olabilir.');
                return;
            }

            // Süre kontrolü
            if (paste.expiry && paste.expiry !== 'burn' && paste.expiry < Date.now()) {
                delete db[id];
                saveDB(db);
                showViewError('⏰ Bu paste\'in süresi dolmuş ve silinmiş.');
                return;
            }

            // Burn kontrolü
            if (paste.expiry === 'burn') {
                if (paste.burned) {
                    delete db[id];
                    saveDB(db);
                    showViewError('🔥 Bu paste okunduktan sonra silindi (burn after reading).');
                    return;
                }
            }

            // Şifre kontrolü
            if (paste.password) {
                const pass = prompt('🔒 Bu paste şifre korumalı. Lütfen şifreyi girin:');
                if (pass !== paste.password) {
                    showViewError('❌ Yanlış şifre! Erişim reddedildi.');
                    return;
                }
            }

            // Görüntüleme sayısını artır
            paste.views = (paste.views || 0) + 1;

            // Burn işlemi
            if (paste.expiry === 'burn') {
                paste.burned = true;
            }

            db[id] = paste;
            saveDB(db);

            // Sayfayı göster
            document.getElementById('mainPage').style.display = 'none';
            document.getElementById('viewPage').style.display = 'block';

            document.getElementById('viewPasteId').textContent = '/' + paste.id;
            document.getElementById('viewPasteContent').textContent = paste.content;
            document.getElementById('viewPasteDate').textContent = '🕒 ' + new Date(paste.createdAt).toLocaleString('tr-TR');
            document.getElementById('viewPasteFolder').textContent = '📁 ' + (paste.folder || 'Genel');
            document.getElementById('viewPasteExpiry').textContent = paste.expiry === 'burn' ? '🔥 Okunduktan sonra silinecek' :
                paste.expiry ? '⏱️ Son kullanma: ' + new Date(paste.expiry).toLocaleString('tr-TR') : '♾️ Süresiz';
        }

        function showViewError(message) {
            document.getElementById('mainPage').style.display = 'none';
            document.getElementById('viewPage').style.display = 'block';
            document.getElementById('viewPasteId').textContent = 'HATA';
            document.getElementById('viewPasteContent').textContent = message;
            document.getElementById('viewPasteDate').textContent = '';
            document.getElementById('viewPasteFolder').textContent = '';
            document.getElementById('viewPasteExpiry').textContent = '';
        }

        function copyViewedPaste() {
            const content = document.getElementById('viewPasteContent').textContent;
            navigator.clipboard.writeText(content).then(() => showToast('📋 İçerik kopyalandı!', 'success'));
        }

        function shareCurrentPaste() {
            const url = window.location.href;
            navigator.clipboard.writeText(url).then(() => showToast('🔗 Link kopyalandı!', 'success'));
        }

        function goHome(e) {
            e.preventDefault();
            document.getElementById('mainPage').style.display = 'block';
            document.getElementById('viewPage').style.display = 'none';
            document.getElementById('pasteListSection').style.display = 'none';
            updateCharCount();
            window.history.pushState({}, '', window.location.pathname);
        }

        // ==================== TOAST ====================
        function showToast(message, type = 'success') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.textContent = message;
            container.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateX(120%)';
                toast.style.transition = 'all 0.3s ease';
                setTimeout(() => toast.remove(), 300);
            }, 3500);
        }

        function escapeHtml(text) {
            const d = document.createElement('div');
            d.textContent = text;
            return d.innerHTML;
        }

        // ==================== TEMİZLİK ====================
        function cleanExpired() {
            const db = getDB();
            const now = Date.now();
            let changed = false;
            for (const id in db) {
                const p = db[id];
                if (p.expiry && p.expiry !== 'burn' && p.expiry < now) {
                    delete db[id];
                    changed = true;
                }
                if (p.expiry === 'burn' && p.burned) {
                    delete db[id];
                    changed = true;
                }
            }
            if (changed) saveDB(db);
        }

        // ==================== BAŞLAT ====================
        window.addEventListener('DOMContentLoaded', () => {
            cleanExpired();
            updateCharCount();

            const params = new URLSearchParams(window.location.search);
            const pasteId = params.get('p');
            if (pasteId) {
                viewPaste(pasteId);
            }

            // Ctrl+Enter kısayolu
            document.addEventListener('keydown', function(e) {
                if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
                    e.preventDefault();
                    createPaste();
                }
            });
        });

        // Popstate (geri/ileri tuşları)
        window.addEventListener('popstate', () => {
            const params = new URLSearchParams(window.location.search);
            const pasteId = params.get('p');
            if (pasteId) {
                viewPaste(pasteId);
            } else {
                document.getElementById('mainPage').style.display = 'block';
                document.getElementById('viewPage').style.display = 'none';
            }
        });
    </script>
</body>
</html>
